[package]
name = "libsql-sqlite3-parser"
description = "SQL parser (as understood by SQLite) (libsql fork)"
version = "0.13.1"
edition = "2021"
authors = ["gwenn"]
license = "Apache-2.0/MIT"
publish = false
build = "build.rs"

# Version is labeled 0.13.1 so Cargo [patch] replaces libsql 0.9.30's
# libsql-sqlite3-parser 0.13.0 pin (GHSA-8m95-fffc-h4c5 / CVE-2025-47736).
# Sources are crates.io 0.13.0 plus lemon-rs 14f422a (`from_utf8_lossy`).

[features]
YYNOERRORRECOVERY = []
default = ["YYNOERRORRECOVERY"]

[dependencies]
phf = { version = "0.11", features = ["uncased"] }
log = "0.4"
memchr = "2.0"
fallible-iterator = "0.3"
bitflags = "2.0"
uncased = "0.9"
indexmap = "2.0"

[build-dependencies]
cc = "1.0"
phf_shared = { version = "0.11", features = ["uncased"] }
phf_codegen = "0.11"
uncased = "0.9"
