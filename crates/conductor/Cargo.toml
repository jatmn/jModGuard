[package]
name = "jmodguard-conductor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Independent jModGuard installation control service"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "query"] }
jmodguard-runtime = { path = "../runtime" }
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
percent-encoding = "2"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "charset", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time", "net", "sync", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "query"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "net", "time"] }
