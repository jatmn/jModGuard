[package]
name = "jmodguard-conductor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Independent jModGuard installation control service"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "query"] }
futures-util = { version = "0.3", default-features = false }
jmodguard-runtime = { path = "../runtime" }
libc = "0.2"
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
percent-encoding = "2"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "charset", "form"] }
ring = { version = "0.17", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time", "net", "sync", "fs", "io-util", "process", "signal"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
url = "2"

[[bin]]
name = "jmodguard-conductor"
path = "src/main.rs"

[[bin]]
name = "jmodguard-update-standin"
path = "src/bin/update_standin.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "query"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "net", "time"] }
