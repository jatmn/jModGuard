[package]
name = "jmodguard-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Small shared process lifecycle, health, and cgroup usage utilities for jModGuard"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt", "time", "signal", "sync", "net", "io-util"] }
tracing = "0.1"
