[package]
name = "jmodguard-updater"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
jmodguard = { path = "../.." }
libc = "0.2"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
ring = { version = "0.17", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "process", "fs", "io-util", "net"] }
tracing = "0.1"

[dev-dependencies]
axum = "0.8"
jmodguard = { path = "../..", features = ["test-support"] }
jmodguard-bot = { path = "../bot" }

[[bin]]
name = "jmodguard-launcher"
path = "src/main.rs"
