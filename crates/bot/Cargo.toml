[package]
name = "jmodguard-bot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
jmodguard = { path = "../.." }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
parking_lot = "0.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "collector", "cache", "model", "builder", "http", "utils", "chrono", "rustls_backend"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio-tungstenite = { version = "0.21", default-features = false, features = ["handshake"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
jmodguard = { path = "../..", features = ["test-support"] }
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
rand = "0.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }
