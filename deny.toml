# Supply-chain policy for cargo-deny (licenses, bans, sources).
# Advisories are not part of this file. Buildkite runs cargo-audit:
# pull requests and ordinary main pushes do not fail the supply-chain check on a new
# CVE advisories on the fail-open path; cargo-audit operational failures still fail the job.
# Scheduled builds fail closed so the advisory is visible.
#
# jModGuard uses Apache 2.0 with Commons Clause 1.0 (a custom LicenseRef).
# Ignore workspace crates marked publish = false; the root crate and
# third-party crates still go through the allow list.

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "LicenseRef-Apache-2.0-with-Commons-Clause-1.0",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]
unused-allowed-license = "allow"
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/jatmn/jModGuard"]
