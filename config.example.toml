# jModGuard configuration.
# Copy this file to `config.toml` and fill in your values.
# The bot ignores [web] and web/OAuth environment overrides; the API validates them.
# Only the bot loads discord.token; the API uses OAuth and queues bot actions.
#
# Dual-process local run:
#   cargo run --bin jmodguard-bot --no-default-features  # migrates DB, Discord gateway
#   cargo run --bin jmodguard-api                       # HTTP API/WebUI (waits ~30s locally for bot migrate)

[discord]
# Bot token from https://discord.com/developers/applications
# (Bot -> Token -> Reset Token). Also overridable via JMODGUARD_DISCORD_TOKEN.
# Required only by jmodguard-bot; the API ignores this section and token override.
token = ""

[db]
# Local SQLite database file path (WAL mode is enabled automatically).
path = "jmodguard.db"
# Remote libSQL URL. Empty = use local `path`. Bunny Database is the documented
# first-class provider; see docs/DEPLOY-BUNNY.md for its acceptance test.
# Portable env: JMODGUARD_DB_URL. Bunny also injects BUNNY_DATABASE_URL.
# Environment URL/token overrides are atomic pairs; setting only one fails closed.
url = ""
# Remote DB access token (server-side only). Portable env: JMODGUARD_DB_TOKEN.
# Bunny also injects BUNNY_DATABASE_AUTH_TOKEN. Required when url is set.
# Do not mix names from the portable and Bunny pairs.
token = ""
# Number of reusable database connections and maximum concurrent database
# operations in this process. Both the bot and API apply this independently.
# Env: JMODGUARD_DB_POOL_SIZE (minimum 2) overrides this value when set.
# Container deploys typically have no config.toml, so set the env var when
# you need something other than 8.
pool_size = 8
# Remote database calls and waits for a pooled connection have a fixed
# 75-second per-request deadline (longer than Bunny's documented failover
# window). Transaction rollback cleanup may use one additional deadline.
# A timed-out write is reported but not automatically
# retried because its commit status may be unknown.

[web]
# Address the API/WebUI listens on (jmodguard-api). Keep 127.0.0.1 unless you have
# a reverse proxy in front of it.
bind = "127.0.0.1:8080"
# Public URL used for the OAuth redirect (must match the redirect URI
# configured in the Discord developer portal).
base_url = "http://localhost:8080"
# Required by jmodguard-api (Discord OAuth2 application credentials).
# https://discord.com/developers/applications -> OAuth2 -> General
# Env: JMODGUARD_OAUTH_CLIENT_ID / JMODGUARD_OAUTH_CLIENT_SECRET.
oauth_client_id = ""
oauth_client_secret = ""
# Comma-separated browser origins only if the admin UI is on a *different*
# hostname than the API (not the Bunny design). Bunny same-origin CDN proxy
# leaves this empty. Env: JMODGUARD_CORS_ORIGINS. `*` is not allowed.
# cors_origins = ["https://admin.example.com"]

# Bot-only positive membership repair; the API ignores this section and its env vars.
# This checks the bot's own membership, never a member roster. See docs/ENROLLMENTS.md.
[enrollment]
enabled = true            # JMODGUARD_ENROLLMENT_REPAIR_ENABLED (true/false)
poll_secs = 15            # JMODGUARD_ENROLLMENT_POLL_SECS; minimum 1
batch_size = 16           # JMODGUARD_ENROLLMENT_BATCH_SIZE; 1..200 guilds/page
sweep_pause_secs = 3600   # JMODGUARD_ENROLLMENT_SWEEP_PAUSE_SECS; minimum 1
retry_secs = 60           # JMODGUARD_ENROLLMENT_RETRY_SECS; minimum 1
request_timeout_secs = 10 # JMODGUARD_ENROLLMENT_REQUEST_TIMEOUT_SECS; 1..300

[bot]
# Used as the durable terminal fallback when neither a guild nor the global
# settings row overrides the field. The bot refreshes that fallback from this
# value at each startup, so changing it can affect inheriting servers. Use the
# WebUI Global settings to set an explicit, persistent override instead.
default_prefix = "!"
# Your Discord user ID (owner). Owner-only commands are gated on this.
# Also required for WebUI "Global" config edits (scope=global / guild_id=0).
# Leaving at 0 blocks all global WebUI mutations. Enable Developer Mode in
# Discord, right-click your avatar -> Copy User ID.
owner_id = 0
# The retired chat-history retention field is no longer an operator setting.
# Presence status text shown under the bot's name.
status = "moderating"
# How often each process polls durable config_version (cross-process cache invalidation).
# Env: JMODGUARD_CONFIG_POLL_SECS.
config_poll_secs = 5

[log]
# tracing level: trace | debug | info | warn | error
level = "info"
# Directory for rolling log files (empty = console only).
# Env: JMODGUARD_LOG_DIRECTORY. The container images set it to empty so logs
# are visible in the platform log stream.
directory = "logs"
# Discord report delivery: no waiting backlog; excess reports are dropped.
# These bootstrap controls will move into Administration.
discord_concurrency = 8       # JMODGUARD_LOG_DISCORD_CONCURRENCY
discord_timeout_secs = 10     # JMODGUARD_LOG_DISCORD_TIMEOUT_SECS

# Administrative action policy; set the same values in bot and API.
# Environment overrides and protocol bounds: docs/BOT-ACTIONS.md.
[actions]
pending_per_guild = 32
max_age_secs = 300
history_retention_secs = 604800
cleanup_batch_size = 128

# Bot-only sequential dispatch and bounded cleanup; API ignores this section.
[action_worker]
poll_secs = 5
cleanup_interval_secs = 3600
batch_size = 4
request_timeout_secs = 15
