agents:
  queue: linux

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Non-secret GHCR login name. There is no Pipeline Settings → Environment page;
  # Buildkite applies this top-level env to uploaded jobs.
  # https://buildkite.com/docs/pipelines/configure/environment-variables
  GHCR_USERNAME: jatmn
  # Bound compiler memory on self-hosted runners. CI checks need assertions,
  # not full debugger symbols or incremental state discarded by git clean.
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # `jobs=1` serializes crates, but one large test rustc can still run several
  # LLVM codegen units concurrently and exceed an agent's memory limit.
  CARGO_PROFILE_TEST_CODEGEN_UNITS: "1"
  CARGO_INCREMENTAL: "0"

steps:
  - label: "select checks"
    key: select-checks
    timeout_in_minutes: 10
    command: bash .buildkite/select-checks.sh upload
