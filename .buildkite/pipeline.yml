agents:
  queue: linux

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

steps:
  - label: "test"
    timeout_in_minutes: 30
    command: |
      set -eu
      mkdir -p .tmp
      export TMPDIR="$PWD/.tmp" CARGO_TARGET_DIR="$PWD/target"
      # Cargo clones git deps into ~/.cargo/git, so `git config --local` on this
      # checkout never applies. GIT_CONFIG_* env vars do, for every git subprocess.
      # Prefer an inherited GITHUB_TOKEN (do not map $$GITHUB_TOKEN in env — that
      # stores the literal string). Otherwise rewrite HTTPS to SSH for the deploy key.
      case "$${GITHUB_TOKEN:-}" in
        ''|'$$GITHUB_TOKEN')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.git@github.com:.insteadof"
          export GIT_CONFIG_VALUE_0="https://github.com/"
          ;;
        *)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0="!f() { echo username=x-access-token; echo password=$${GITHUB_TOKEN}; }; f"
          ;;
      esac
      cargo fetch --locked
      cargo test --locked
      cargo test --locked --no-default-features --lib
      cargo clippy --locked --bins -- -D warnings
      cargo clippy --locked --bin jmodguard-bot --no-default-features -- -D warnings
      cargo clippy --locked --bin jmodguard-api --no-default-features --features web -- -D warnings
      node --test scripts/frontend-warmup-test.mjs
      node --test scripts/publish-frontend-test.mjs
      python3 scripts/frontend-release-test.py
      cargo test --locked --test dual_process_smoke -- --nocapture
      cargo build --locked --bin jmodguard-bot --no-default-features
      cargo build --locked --bin jmodguard-api
      cargo build --locked --bin jmodguard-api --no-default-features --features web

  - label: "remote-database"
    timeout_in_minutes: 30
    command: |
      set -euo pipefail
      mkdir -p .tmp
      export TMPDIR="$PWD/.tmp" CARGO_TARGET_DIR="$PWD/target"
      case "$${GITHUB_TOKEN:-}" in
        ''|'$$GITHUB_TOKEN')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.git@github.com:.insteadof"
          export GIT_CONFIG_VALUE_0="https://github.com/"
          ;;
        *)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0="!f() { echo username=x-access-token; echo password=$${GITHUB_TOKEN}; }; f"
          ;;
      esac
      cargo fetch --locked
      NAME="libsql-ci-$${BUILDKITE_JOB_ID}"
      trap 'docker rm -f "$$NAME"' EXIT
      docker run -d --name "$$NAME" -p 127.0.0.1::8080 \
        ghcr.io/tursodatabase/libsql-server@sha256:1bc51611928ccc51229bdc40ca0defcb915907f8f9f6a664b43529de0ca45fab
      HOST_PORT=$$(docker port "$$NAME" 8080/tcp | tail -1 | cut -d: -f2)
      if [ -z "$$HOST_PORT" ]; then
        echo "failed to resolve host port for $$NAME" >&2
        exit 1
      fi
      export JMODGUARD_REMOTE_TEST_URL=http://127.0.0.1:$${HOST_PORT}
      export JMODGUARD_REMOTE_TEST_TOKEN=local-ci-token
      ready=0
      i=0
      while [ "$i" -lt 30 ]; do
        if curl -sS -o /dev/null --connect-timeout 1 "$$JMODGUARD_REMOTE_TEST_URL"; then
          ready=1
          break
        fi
        i=$((i + 1))
        sleep 1
      done
      if [ "$ready" -ne 1 ]; then
        echo "$$NAME did not become ready within 30s" >&2
        exit 1
      fi
      cargo test --locked --test remote_database_smoke -- --ignored --nocapture
