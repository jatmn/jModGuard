agents:
  queue: linux

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Non-secret GHCR login name. There is no Pipeline Settings → Environment page;
  # Buildkite applies this top-level env to uploaded jobs.
  # https://buildkite.com/docs/pipelines/configure/environment-variables
  GHCR_USERNAME: jatmn
  # Bound compiler memory on self-hosted runners. CI checks need assertions,
  # not full debugger symbols or incremental state discarded by git clean.
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

steps:
  - label: "test"
    key: test
    timeout_in_minutes: 30
    command: |
      set -eu
      mkdir -p .tmp
      export TMPDIR="$$PWD/.tmp" CARGO_TARGET_DIR="$$PWD/target"
      # Cargo clones git deps into ~/.cargo/git, so `git config --local` on this
      # checkout never applies. GIT_CONFIG_* env vars do, for every git subprocess.
      # Prefer an inherited GITHUB_TOKEN (do not map $$GITHUB_TOKEN in env — that
      # stores the literal string). Otherwise rewrite HTTPS to SSH for the deploy key.
      case "$${GITHUB_TOKEN:-}" in
        ''|'$$GITHUB_TOKEN')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.git@github.com:.insteadof"
          export GIT_CONFIG_VALUE_0="https://github.com/"
          ;;
        *)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0="!f() { echo username=x-access-token; echo password=$${GITHUB_TOKEN}; }; f"
          ;;
      esac
      cargo fetch --locked
      python3 .buildkite/publish-image-test.py
      python3 .buildkite/release-test.py
      cargo test --locked --workspace
      cargo test --locked -p jmodguard-api --no-default-features --lib
      cargo clippy --locked --workspace --bins --lib -- -D warnings
      cargo clippy --locked -p jmodguard-bot -- -D warnings
      cargo clippy --locked -p jmodguard-api --no-default-features -- -D warnings
      cargo clippy --locked -p jmodguard-runtime -p jmodguard-conductor --all-targets -- -D warnings
      cargo build --locked -p jmodguard-conductor
      python3 scripts/check-service-boundaries.py
      node --test scripts/frontend-state-test.mjs
      node --test scripts/frontend-warmup-test.mjs
      node --test scripts/publish-frontend-test.mjs
      python3 scripts/frontend-release-test.py
      cargo test --locked -p jmodguard-integration-tests --test dual_process_smoke -- --nocapture
      cargo build --locked -p jmodguard-bot
      cargo build --locked -p jmodguard-api
      cargo build --locked -p jmodguard-api --no-default-features

  - label: "remote-database"
    key: remote-database
    timeout_in_minutes: 30
    command: |
      set -euo pipefail
      mkdir -p .tmp
      export TMPDIR="$$PWD/.tmp" CARGO_TARGET_DIR="$$PWD/target"
      case "$${GITHUB_TOKEN:-}" in
        ''|'$$GITHUB_TOKEN')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.git@github.com:.insteadof"
          export GIT_CONFIG_VALUE_0="https://github.com/"
          ;;
        *)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0="!f() { echo username=x-access-token; echo password=$${GITHUB_TOKEN}; }; f"
          ;;
      esac
      cargo fetch --locked
      # Each schema test needs a distinct empty server. Never reset/adopt the core DB.
      for TEST_TARGET in remote_database_smoke guild_store_smoke bunny_evidence; do
        NAME="libsql-ci-$${BUILDKITE_JOB_ID}-$${TEST_TARGET}"
        trap 'docker rm -f "$$NAME"' EXIT
        docker run -d --name "$$NAME" -p 127.0.0.1::8080 \
          ghcr.io/tursodatabase/libsql-server@sha256:1bc51611928ccc51229bdc40ca0defcb915907f8f9f6a664b43529de0ca45fab
        HOST_PORT=$$(docker port "$$NAME" 8080/tcp | tail -1 | cut -d: -f2)
        if [ -z "$$HOST_PORT" ]; then
          echo "failed to resolve host port for $$NAME" >&2
          exit 1
        fi
        export JMODGUARD_REMOTE_TEST_URL=http://127.0.0.1:$${HOST_PORT}
        export JMODGUARD_REMOTE_TEST_TOKEN=local-ci-token
        ready=0
        i=0
        while [ "$$i" -lt 30 ]; do
          # GET / is a WebSocket upgrade route (404 for curl), not the health route.
          if curl -fsS -o /dev/null --connect-timeout 1 --max-time 1 "$$JMODGUARD_REMOTE_TEST_URL/health"; then
            ready=1
            break
          fi
          i=$((i + 1))
          sleep 1
        done
        if [ "$$ready" -ne 1 ]; then
          echo "$$NAME did not become healthy after 30 attempts" >&2
          exit 1
        fi
        if [ "$$TEST_TARGET" = bunny_evidence ]; then
          cargo test --locked -p jmodguard --lib bunny_evidence::tests::remote_bunny_journal_recovers_commits -- --ignored --exact --nocapture
        else
          cargo test --locked -p jmodguard-integration-tests --test "$$TEST_TARGET" -- --ignored --nocapture
        fi
        docker rm -f "$$NAME"
        trap - EXIT
      done

  # Match publish-image.py request() success paths, except UI/API with
  # JMODGUARD_PUBLISH_SOURCE is scheduled even off main / with a tag so Python
  # can fail an invalid manual instead of a green skip of an attempted publish.
  - label: "prepare image publication"
    key: prepare-images
    depends_on: [test, remote-database]
    if: &publish_if
      build.pull_request.id == null && (
        (build.source == "webhook" && build.tag != null) ||
        (build.source == "webhook" && build.branch == "main" && build.tag == null &&
          (build.env("BUILDKITE_GITHUB_EVENT") == null || build.env("BUILDKITE_GITHUB_EVENT") == "push")) ||
        ((build.source == "ui" || build.source == "api") &&
          build.env("JMODGUARD_PUBLISH_SOURCE") != null && build.env("JMODGUARD_PUBLISH_SOURCE") != "") ||
        (build.source == "schedule" && build.branch == "main" && build.tag == null)
      )
    timeout_in_minutes: 5
    command: python3 .buildkite/publish-image.py prepare

  - label: "publish bot image"
    key: publish-bot
    depends_on: prepare-images
    if: *publish_if
    concurrency: 1
    concurrency_group: jmodguard/ghcr-bot
    timeout_in_minutes: 45
    command: python3 .buildkite/publish-image.py bot

  - label: "publish api image"
    key: publish-api
    depends_on: prepare-images
    if: *publish_if
    concurrency: 1
    concurrency_group: jmodguard/ghcr-api
    timeout_in_minutes: 45
    command: python3 .buildkite/publish-image.py api

  - label: "publish conductor image"
    key: publish-conductor
    depends_on: prepare-images
    if: *publish_if
    concurrency: 1
    concurrency_group: jmodguard/ghcr-conductor
    timeout_in_minutes: 45
    command: python3 .buildkite/publish-image.py conductor

  - label: "publish release manifest"
    key: publish-manifest
    depends_on: [publish-bot, publish-api, publish-conductor]
    if: *publish_if
    timeout_in_minutes: 10
    command: python3 .buildkite/publish-image.py manifest

  - label: "release please"
    key: release-please
    depends_on: [test, remote-database]
    if: build.pull_request.id == null && build.source == "webhook" && build.branch == "main" && build.tag == null && (build.env("BUILDKITE_GITHUB_EVENT") == null || build.env("BUILDKITE_GITHUB_EVENT") == "push")
    timeout_in_minutes: 10
    command: python3 .buildkite/release-please.py
