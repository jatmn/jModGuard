agents:
  queue: linux

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GHCR_USERNAME: jatmn
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_TEST_CODEGEN_UNITS: "1"
  CARGO_INCREMENTAL: "0"

steps:
  # group: contracts
  - label: "contracts"
    key: contracts
    if: __SELECTED__
    timeout_in_minutes: 10
    command: bash scripts/ci-preflight.sh --only contracts

  # group: frontend
  - label: "frontend"
    key: frontend
    if: __SELECTED__
    timeout_in_minutes: 15
    command: bash scripts/ci-preflight.sh --only frontend

  # group: fmt
  - label: "fmt"
    key: fmt
    if: __SELECTED__
    timeout_in_minutes: 15
    command: bash .buildkite/with-cargo-auth.sh bash scripts/ci-preflight.sh --only fmt

  # group: dylint
  - label: "dylint"
    key: dylint
    if: __SELECTED__
    timeout_in_minutes: 90
    command: bash .buildkite/with-cargo-auth.sh bash scripts/ci-preflight.sh --only dylint

  # group: api
  - label: "api"
    key: api
    if: __SELECTED__
    timeout_in_minutes: 45
    command: bash .buildkite/with-cargo-auth.sh bash scripts/ci-preflight.sh --only api

  # group: bot
  - label: "bot"
    key: bot
    if: __SELECTED__
    timeout_in_minutes: 45
    command: bash .buildkite/with-cargo-auth.sh bash scripts/ci-preflight.sh --only bot

  # group: runtime
  - label: "runtime"
    key: runtime
    if: __SELECTED__
    timeout_in_minutes: 30
    command: bash .buildkite/with-cargo-auth.sh bash scripts/ci-preflight.sh --only runtime

  # group: updater
  - label: "updater"
    key: updater
    if: __SELECTED__
    timeout_in_minutes: 30
    command: bash .buildkite/with-cargo-auth.sh bash scripts/ci-preflight.sh --only updater

  # group: core
  - label: "core"
    key: core
    if: __SELECTED__
    timeout_in_minutes: 45
    command: bash .buildkite/with-cargo-auth.sh bash scripts/ci-preflight.sh --only core

  # group: integration
  - label: "integration"
    key: integration
    if: __SELECTED__
    timeout_in_minutes: 45
    command: bash .buildkite/with-cargo-auth.sh bash scripts/ci-preflight.sh --only integration

  # group: boundaries
  - label: "boundaries"
    key: boundaries
    if: __SELECTED__
    timeout_in_minutes: 20
    command: bash .buildkite/with-cargo-auth.sh bash scripts/ci-preflight.sh --only boundaries

  # group: publish-tests
  - label: "publish tests"
    key: publish-tests
    if: __SELECTED__
    timeout_in_minutes: 15
    command: bash scripts/ci-preflight.sh --only publish-tests

  # group: bootstrap
  - label: "bootstrap"
    key: bootstrap
    if: __SELECTED__
    timeout_in_minutes: 15
    command: bash scripts/ci-preflight.sh --only bootstrap

  # group: pullfrog
  - label: "pullfrog"
    key: pullfrog
    if: __SELECTED__
    timeout_in_minutes: 10
    command: bash scripts/ci-preflight.sh --only pullfrog

  # group: supply-chain
  - label: "supply-chain"
    key: supply-chain
    if: __SELECTED__
    timeout_in_minutes: 20
    command: bash .buildkite/with-cargo-auth.sh bash scripts/ci-preflight.sh --only supply-chain

  # group: remote-database
  - label: "remote-database"
    key: remote-database
    if: __SELECTED__
    timeout_in_minutes: 30
    command: |
      set -euo pipefail
      bash .buildkite/with-cargo-auth.sh bash -s <<'REMOTE'
      set -euo pipefail
      cargo fetch --locked
      for TEST_TARGET in remote_database_smoke guild_store_smoke bunny_evidence; do
        NAME="libsql-ci-$${BUILDKITE_JOB_ID}-$${TEST_TARGET}"
        trap 'docker rm -f "$$NAME"' EXIT
        docker run -d --name "$$NAME" -p 127.0.0.1::8080 \
          ghcr.io/tursodatabase/libsql-server@sha256:1bc51611928ccc51229bdc40ca0defcb915907f8f9f6a664b43529de0ca45fab
        HOST_PORT=$$(docker port "$$NAME" 8080/tcp | tail -1 | cut -d: -f2)
        if [ -z "$$HOST_PORT" ]; then
          echo "failed to resolve host port for $$NAME" >&2
          exit 1
        fi
        export JMODGUARD_REMOTE_TEST_URL=http://127.0.0.1:$${HOST_PORT}
        export JMODGUARD_REMOTE_TEST_TOKEN=local-ci-token
        ready=0
        i=0
        while [ "$$i" -lt 30 ]; do
          if curl -fsS -o /dev/null --connect-timeout 1 --max-time 1 "$$JMODGUARD_REMOTE_TEST_URL/health"; then
            ready=1
            break
          fi
          i=$((i + 1))
          sleep 1
        done
        if [ "$$ready" -ne 1 ]; then
          echo "$$NAME did not become healthy after 30 attempts" >&2
          exit 1
        fi
        if [ "$$TEST_TARGET" = bunny_evidence ]; then
          cargo test --locked -p jmodguard --lib bunny_evidence::tests::remote_bunny_journal_recovers_commits -- --ignored --exact --nocapture
        else
          cargo test --locked -p jmodguard-integration-tests --test "$$TEST_TARGET" -- --ignored --nocapture
        fi
        docker rm -f "$$NAME"
        trap - EXIT
      done
      REMOTE

  # group: publish
  - label: "prepare image publication"
    key: prepare-images
    depends_on:
      - step: contracts
        allow_failure: false
      - api
      - bot
      - runtime
      - updater
      - core
      - integration
      - boundaries
      - frontend
      - fmt
      - dylint
      - publish-tests
      - bootstrap
      - pullfrog
      - supply-chain
      - remote-database
    if: &publish_if
      build.pull_request.id == null && (
        (build.source == "webhook" && build.tag != null) ||
        (build.source == "webhook" && build.branch == "main" && build.tag == null &&
          (build.env("BUILDKITE_GITHUB_EVENT") == null || build.env("BUILDKITE_GITHUB_EVENT") == "push")) ||
        ((build.source == "ui" || build.source == "api") &&
          build.env("JMODGUARD_PUBLISH_SOURCE") != null && build.env("JMODGUARD_PUBLISH_SOURCE") != "") ||
        (build.source == "schedule" && build.branch == "main" && build.tag == null)
      )
    timeout_in_minutes: 5
    command: bash .buildkite/publish-image.sh prepare

  # group: publish
  - label: "publish bot image"
    key: publish-bot
    depends_on: prepare-images
    if: *publish_if
    concurrency: 1
    concurrency_group: jmodguard/ghcr-bot
    timeout_in_minutes: 45
    command: bash .buildkite/publish-image.sh bot

  # group: publish
  - label: "publish api image"
    key: publish-api
    depends_on: prepare-images
    if: *publish_if
    concurrency: 1
    concurrency_group: jmodguard/ghcr-api
    timeout_in_minutes: 45
    command: bash .buildkite/publish-image.sh api

  # group: publish
  - label: "publish WebUI asset package"
    key: publish-webui
    depends_on: prepare-images
    if: *publish_if
    concurrency: 1
    concurrency_group: jmodguard/ghcr-webui
    timeout_in_minutes: 15
    command: bash .buildkite/publish-image.sh webui

  # group: publish
  - label: "release please"
    key: release-please
    depends_on:
      - contracts
      - api
      - bot
      - runtime
      - updater
      - core
      - integration
      - boundaries
      - frontend
      - fmt
      - dylint
      - publish-tests
      - bootstrap
      - pullfrog
      - supply-chain
      - remote-database
    if: build.pull_request.id == null && build.source == "webhook" && build.branch == "main" && build.tag == null && (build.env("BUILDKITE_GITHUB_EVENT") == null || build.env("BUILDKITE_GITHUB_EVENT") == "push")
    timeout_in_minutes: 10
    command: bash .buildkite/release-please.sh
