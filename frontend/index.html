<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e0eeff">
<meta name="description" content="Your Discord moderation workspace. Configure protection, manage commands, and keep your community in view.">
<title>jModGuard · Moderation workspace</title>
<script>
// Apply the saved appearance before CSS paints, including on the sign-in screen.
try {
  const theme = localStorage.getItem("jmodguard.theme");
  document.documentElement.dataset.theme = theme === "dark" ||
    (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
} catch (_) {
  document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<a class="skip-link" href="#content">Skip to workspace</a>
<div id="app"></div>
<script src="/app.js"></script>
</body>
</html>
