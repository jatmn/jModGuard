<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e0eeff">
  <title>Administration · jModGuard</title>
<script>
// Apply the saved appearance before CSS paints, including on the sign-in screen.
try {
  const theme = localStorage.getItem("jmodguard.theme");
  document.documentElement.dataset.theme = theme === "dark" ||
    (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
} catch (_) {
  document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
</script>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="administration-page">
  <a class="skip-link" href="#content">Skip to updates</a>
  <main id="content" class="administration-content" tabindex="-1">
  </main>
  <script src="/administration.js"></script>
</body>
</html>
