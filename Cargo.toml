[workspace]
resolver = "3"
members = [".", "crates/runtime", "crates/bot", "crates/api", "crates/updater", "crates/integration-tests"]
# Bare workspace commands validate all packages. Production builds select a service with -p.
default-members = [".", "crates/runtime", "crates/bot", "crates/api", "crates/updater", "crates/integration-tests"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "LicenseRef-Apache-2.0-with-Commons-Clause-1.0"

[package]
name = "jmodguard"
version = "0.2.0"
edition = "2024"
description = "Shared jModGuard configuration, data model and database access"
license = "LicenseRef-Apache-2.0-with-Commons-Clause-1.0"
autobins = false
rust-version = "1.96"

[features]
test-support = []

[dependencies]
http = "1"
url = "2"
jmodguard-runtime = { path = "crates/runtime" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
hyper = { version = "0.14", default-features = false, features = ["client", "http1", "tcp", "runtime"] }
libsql = { version = "0.10.0", default-features = false, features = ["core", "remote"] }
rand = "0.10"
regex = "1"
# Reuse the crypto implementation already required by rustls for streaming SHA-256.
ring = { version = "0.17", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "io-util", "fs"] }
fallible-iterator = "0.3"
libsql-sqlite3-parser = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"

[dev-dependencies]
hyper = { version = "0.14", default-features = false, features = ["server"] }
rustls-webpki = { version = "0.103.13", default-features = false, features = ["ring", "std"] }

[patch.crates-io]
libsql-sqlite3-parser = { git = "https://github.com/jatmn/jModGuard", rev = "f2391d613c4bb8018873964e779341f50ce05447" }
tokio-tungstenite = { path = "vendor/tokio-tungstenite" }
