[workspace]
resolver = "3"
members = [".", "crates/runtime", "crates/conductor"]
default-members = [".", "crates/runtime", "crates/conductor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"

[package]
name = "jmodguard"
version = "0.1.0"
edition = "2024"
description = "A data-driven Discord moderation bot: automod, spam protection, multi-server config with global scoping, WebUI."
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
autobins = false
rust-version = "1.96"

[features]
default = ["web", "embed-ui"]
# JSON API + OAuth (axum + sessions). Bot builds with --no-default-features.
# The API container image uses this without `embed-ui`: Bunny serves `frontend/`
# from Storage/CDN, and Magic Containers stay private.
web = ["dep:axum", "dep:tower-sessions", "dep:tower-http"]
# Bake `frontend/` into the API binary for local SETUP.md. Not used on Bunny.
embed-ui = ["web"]

[[bin]]
name = "jmodguard-bot"
path = "src/bin/jmodguard-bot.rs"

[[bin]]
name = "jmodguard-api"
path = "src/bin/jmodguard-api.rs"
required-features = ["web"]

[dependencies]
jmodguard-runtime = { path = "crates/runtime" }
anyhow = "1"
axum = { version = "0.8", optional = true, features = ["json", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
parking_lot = "0.12"
percent-encoding = "2"
hyper = { version = "0.14", default-features = false, features = ["client", "http1", "tcp", "runtime"] }
libsql = { version = "0.9.30", default-features = false, features = ["core", "remote"] }
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "charset", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "cache", "model", "builder", "http", "utils", "chrono", "rustls_backend"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1"
thiserror = "2"
tower-http = { version = "0.6", optional = true, features = ["cors", "set-header"] }
tower-sessions = { version = "0.14", optional = true, features = ["memory-store"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"

[dev-dependencies]
fallible-iterator = "0.3"
libsql-sqlite3-parser = "0.13"
rustls-webpki = { version = "0.103.13", default-features = false, features = ["ring", "std"] }
tower = "0.5.3"

[patch.crates-io]
libsql-sqlite3-parser = { git = "https://github.com/jatmn/jModGuard", rev = "f2391d613c4bb8018873964e779341f50ce05447" }
tokio-tungstenite = { path = "vendor/tokio-tungstenite" }
