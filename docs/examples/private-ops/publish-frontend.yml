# Copy to .github/workflows/ in your private ops repo; see the sibling README.
# Ops main selects a release. Source pushes do not select production.
name: Publish jModGuard admin UI

on:
  push:
    branches: [main]
    paths: [frontend-release.json]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  # API deployment workflows in this ops repo must use this same group.
  group: deploy-api-${{ vars.JMODGUARD_API_APP_ID }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current approved ops configuration
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          path: ops
          persist-credentials: false

      - name: Resolve approved source
        id: release
        run: python3 ops/scripts/frontend_release.py resolve ops/frontend-release.json >> "$GITHUB_OUTPUT"

      - name: Check out approved assets
        if: steps.release.outputs.enabled == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jatmn/jModGuard
          ref: ${{ steps.release.outputs.source_sha }}
          path: source
          persist-credentials: false
          token: ${{ secrets.JMODGUARD_CHECKOUT_TOKEN || github.token }}

      - name: Verify live publication and approved API
        if: steps.release.outputs.enabled == 'true'
        id: gate
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_STORAGE_ENDPOINT: ${{ secrets.BUNNY_STORAGE_ENDPOINT }}
          BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          JMODGUARD_API_APP_ID: ${{ vars.JMODGUARD_API_APP_ID }}
          JMODGUARD_READINESS_URL: ${{ vars.JMODGUARD_READINESS_URL }}
        run: python3 ops/scripts/frontend_release.py check ops/frontend-release.json source >> "$GITHUB_OUTPUT"

      - name: Publish with reviewed ops-owned tooling
        if: steps.gate.outputs.publish == 'true'
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_STORAGE_ENDPOINT: ${{ secrets.BUNNY_STORAGE_ENDPOINT }}
          BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          JMODGUARD_FRONTEND_ROOT: ${{ github.workspace }}/source/frontend
        run: bash ops/scripts/publish-frontend-bunny.sh
