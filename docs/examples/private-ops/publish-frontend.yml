# Copy this workflow into *your* private ops repository.
# Do not enable it on the public jModGuard repo: it needs Bunny Storage
# credentials that must not live there.
#
# The runner checks out a jModGuard tag or SHA from GitHub and uploads
# frontend/ to Bunny Storage (then purges the Pull Zone). That is the
# designed publisher for the admin UI.
#
# `ref` must be the same git tag or commit SHA as the bot and API images
# you are running. Do not dispatch floating `main`. After copying into
# ops, add a check that rejects any ref other than your recorded pin
# (see jmodguard-ops: compare inputs.ref to docs/BUNNY.md).

name: Publish jModGuard admin UI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or commit SHA; must match the running bot/API images (not floating main)
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out jModGuard source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jatmn/jModGuard
          ref: ${{ inputs.ref }}
          persist-credentials: false
          # Cross-repo checkout of private jModGuard needs a PAT
          # (contents:read). Once this source repo is public, github.token
          # from the ops runner is enough.
          token: ${{ secrets.JMODGUARD_CHECKOUT_TOKEN || github.token }}

      - name: Upload frontend/ to Bunny Storage
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_STORAGE_ENDPOINT: ${{ secrets.BUNNY_STORAGE_ENDPOINT }}
          BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          set -eu
          # Workspace is the jModGuard checkout from the previous step.
          test -f scripts/publish-frontend-bunny.sh
          bash scripts/publish-frontend-bunny.sh
