# Version updates run as GitHub Actions dynamic workflows
# (`dynamic/dependabot/dependabot-updates`). They are not stored under
# `.github/workflows` and do not consume included Actions minutes on
# standard GitHub-hosted runners.
#
# Keep Settings → Advanced Security → Dependabot on self-hosted runners
# disabled. This repository has no GitHub Actions self-hosted runners;
# CI is Buildkite. Enabling that setting queues every cycle on a
# `dependabot` label until GitHub cancels it after 24 hours. Do not
# register leftover Proxmox GHA runners or label any runner `dependabot`.
#
# Private GitHub.com repositories are supported. The Cargo git patch is
# this same private repository, not GitHub Packages; the 2026-09-08
# Packages automatic-access change does not apply here.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # This security patch lives at a reviewed revision on a separate branch
    # of this repository. Replacing it requires manual regression testing.
    ignore:
      - dependency-name: libsql-sqlite3-parser
