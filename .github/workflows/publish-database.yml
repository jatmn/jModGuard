# Rebuild the bot image on push of migrations/ to main (the bot applies SQL).
# No workflow_dispatch: a feature branch must not retag :latest.

name: Publish database image

on:
  push:
    branches: [main]
    paths:
      - migrations/**
      - .github/workflows/publish-database.yml

permissions:
  contents: read
  packages: write

jobs:
  pick-runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  publish:
    needs: pick-runner
    uses: ./.github/workflows/publish-image.yml
    with:
      component: bot
      checkout_ref: ${{ github.sha }}
      runner: ${{ needs.pick-runner.outputs.runner }}
    secrets: inherit
