name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      source_sha:
        description: 'Pinned automatic release source; validates the full snapshot when supplied'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# PRs cancel obsolete work. Trusted callers own their publication queue.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_CODEGEN_UNITS: '16'
  CARGO_PROFILE_TEST_CODEGEN_UNITS: '16'
  CARGO_INCREMENTAL: '0'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: credential.helper
  GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$GITHUB_TOKEN"; }; f'

jobs:
  plan:
    if: >-
      (!github.event.repository.private || vars.JMODGUARD_ENABLE_PRIVATE_CI == 'true') &&
      github.repository == 'jatmn/jModGuard' &&
      (github.event_name != 'workflow_dispatch' ||
       (github.ref == 'refs/heads/main' && github.actor == 'jatmn' &&
        github.triggering_actor == 'jatmn' && github.actor_id == '12479882'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - id: select
        name: Select affected jobs
        env:
          JMODGUARD_DIFF_BASE: ${{ inputs.source_sha == '' && (github.event.pull_request.base.sha || github.event.before) || '' }}
          JMODGUARD_DIFF_HEAD: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          matrix="$(bash scripts/select-checks.sh matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          printf '### Selected checks\n\n    %s\n' "$matrix" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Checks / ${{ matrix.lane }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    env:
      CARGO_TARGET_DIR: target
      GITHUB_TOKEN: ${{ github.token }}
      JMODGUARD_DYLINT_PACKAGES: ${{ matrix.dylint_packages }}
      JMODGUARD_AUDIT_FAIL_CLOSED: ${{ github.event_name == 'schedule' && '1' || '0' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
          cache: ${{ matrix.lane != 'quick' && 'npm' || '' }}
          cache-dependency-path: |
            tools/webui/package-lock.json
            tools/eslint/package-lock.json
      - name: Configure runner
        env:
          NEED_RUST: ${{ matrix.rust }}
          NEED_NEXTEST: ${{ startsWith(matrix.lane, 'rust-') }}
        run: bash scripts/ci-setup.sh "$NEED_RUST"
      - name: Cache Rust dependencies
        if: matrix.rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ startsWith(matrix.lane, 'rust-') && 'rust' || matrix.lane }}
          cache-targets: ${{ startsWith(matrix.lane, 'rust-') || matrix.lane == 'dylint' || matrix.lane == 'remote-database' }}
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Cache pinned lint and audit tools
        if: matrix.lane == 'dylint' || matrix.lane == 'supply-chain'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/jmodguard-ci
          key: ci-tools-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lane }}-${{ hashFiles('rust-toolchain.toml', 'dylint.toml', 'scripts/dylint.sh', 'scripts/ci-ensure-cargo-tool.sh') }}
      - name: Cache Rust compiler outputs
        if: startsWith(matrix.lane, 'rust-')
        timeout-minutes: 3
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - name: Run selected checks
        env:
          # Set the wrapper after dependency restoration to preserve its cache key.
          RUSTC_WRAPPER: ${{ startsWith(matrix.lane, 'rust-') && 'sccache' || '' }}
          SCCACHE_GHA_ENABLED: 'true'
          # PR writes are merge-ref scoped; main cannot restore those entries.
          SCCACHE_GHA_RW_MODE: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'READ_WRITE' || 'READ_ONLY' }}
          CHECK_GROUPS: ${{ matrix.groups }}
          JMODGUARD_DIFF_BASE: ${{ inputs.source_sha == '' && (github.event.pull_request.base.sha || github.event.before) || '' }}
          JMODGUARD_DIFF_HEAD: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$CHECK_GROUPS" = remote-database ]; then
            bash scripts/ci-remote-database.sh
          else
            read -r -a groups <<< "$CHECK_GROUPS"
            args=()
            for group in "${groups[@]}"; do args+=(--only "$group"); done
            bash scripts/ci-preflight.sh "${args[@]}"
          fi

  ci:
    name: CI passed
    needs: [plan, checks]
    if: always() && (!github.event.repository.private || vars.JMODGUARD_ENABLE_PRIVATE_CI == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected job to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$PLAN_RESULT" = success && test "$CHECK_RESULT" = success
