name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep artifacts off /tmp when runners are constrained.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  TMPDIR: ${{ github.workspace }}/.tmp

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Check Windows builds
        run: |
          cargo check --locked --bin jmodguard-bot --no-default-features
          cargo check --locked --bin jmodguard-api

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        # Pin matches rust-toolchain.toml / Dockerfiles (not floating @stable).
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Create temp dir
        run: mkdir -p "$TMPDIR"

      - name: cargo test --locked
        run: cargo test --locked

      - name: cargo test --locked --no-default-features --lib
        run: cargo test --locked --no-default-features --lib

      - name: cargo clippy --locked --bins -- -D warnings
        run: cargo clippy --locked --bins -- -D warnings

      - name: cargo clippy slim bot (no web feature)
        run: cargo clippy --locked --bin jmodguard-bot --no-default-features -- -D warnings

      - name: cargo clippy API without embedded UI
        run: cargo clippy --locked --bin jmodguard-api --no-default-features --features web -- -D warnings

      - name: frontend warmup contract
        run: node --test scripts/frontend-warmup-test.mjs

      - name: dual-process smoke (no Discord)
        run: cargo test --locked --test dual_process_smoke -- --nocapture

      - name: bot builds without web feature
        run: cargo build --locked --bin jmodguard-bot --no-default-features

      - name: api builds with web feature
        run: cargo build --locked --bin jmodguard-api

      - name: api container shape (no embedded UI)
        run: cargo build --locked --bin jmodguard-api --no-default-features --features web

  remote-database:
    runs-on: ubuntu-latest
    services:
      libsql:
        image: ghcr.io/tursodatabase/libsql-server@sha256:1bc51611928ccc51229bdc40ca0defcb915907f8f9f6a664b43529de0ca45fab
        ports:
          - 8080:8080
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      JMODGUARD_REMOTE_TEST_URL: http://127.0.0.1:8080
      JMODGUARD_REMOTE_TEST_TOKEN: local-ci-token
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: remote libSQL bot/API smoke
        run: cargo test --locked --test remote_database_smoke -- --ignored --nocapture
