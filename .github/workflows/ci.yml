name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep artifacts off /tmp when runners are constrained.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  TMPDIR: ${{ github.workspace }}/.tmp
  # libsql-sqlite3-parser is git-patched from this private repo; libgit2
  # cannot use GITHUB_TOKEN, so Cargo must invoke git(1).
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Pin matches rust-toolchain.toml / Dockerfiles (not floating @stable).
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Create temp dir
        run: mkdir -p "$TMPDIR"

      - name: Prefetch locked crates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0="!f() { echo username=x-access-token; echo password=${GITHUB_TOKEN}; }; f"
          cargo fetch --locked

      - name: cargo test --locked
        env:
          GITHUB_TOKEN: ""
        run: cargo test --locked

      - name: cargo test --locked --no-default-features --lib
        env:
          GITHUB_TOKEN: ""
        run: cargo test --locked --no-default-features --lib

      - name: cargo clippy --locked --bins -- -D warnings
        env:
          GITHUB_TOKEN: ""
        run: cargo clippy --locked --bins -- -D warnings

      - name: cargo clippy slim bot (no web feature)
        env:
          GITHUB_TOKEN: ""
        run: cargo clippy --locked --bin jmodguard-bot --no-default-features -- -D warnings

      - name: cargo clippy API without embedded UI
        env:
          GITHUB_TOKEN: ""
        run: cargo clippy --locked --bin jmodguard-api --no-default-features --features web -- -D warnings

      - name: frontend warmup contract
        run: node --test scripts/frontend-warmup-test.mjs

      - name: frontend publish rollback
        run: node --test scripts/publish-frontend-test.mjs

      - name: dual-process smoke (no Discord)
        env:
          GITHUB_TOKEN: ""
        run: cargo test --locked --test dual_process_smoke -- --nocapture

      - name: bot builds without web feature
        env:
          GITHUB_TOKEN: ""
        run: cargo build --locked --bin jmodguard-bot --no-default-features

      - name: api builds with web feature
        env:
          GITHUB_TOKEN: ""
        run: cargo build --locked --bin jmodguard-api

      - name: api container shape (no embedded UI)
        env:
          GITHUB_TOKEN: ""
        run: cargo build --locked --bin jmodguard-api --no-default-features --features web

  remote-database:
    runs-on: ubuntu-latest
    services:
      libsql:
        image: ghcr.io/tursodatabase/libsql-server@sha256:1bc51611928ccc51229bdc40ca0defcb915907f8f9f6a664b43529de0ca45fab
        ports:
          - 8080:8080
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      JMODGUARD_REMOTE_TEST_URL: http://127.0.0.1:8080
      JMODGUARD_REMOTE_TEST_TOKEN: local-ci-token
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Prefetch locked crates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0="!f() { echo username=x-access-token; echo password=${GITHUB_TOKEN}; }; f"
          cargo fetch --locked

      - name: remote libSQL bot/API smoke
        env:
          GITHUB_TOKEN: ""
        run: cargo test --locked --test remote_database_smoke -- --ignored --nocapture
