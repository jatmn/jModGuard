# Socket Security manifest scan. CI and image publication stay on GitHub Actions.
name: socket-security-workflow
run-name: Socket Security

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: socket-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  socket-security:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Socket CLI
        run: pip install socketsecurity==2.10.2

      - name: Run Socket Security Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # socketcli 2.10.2 scans only opened and synchronize. A reopen is the
          # same diff, so present it as synchronize instead of exiting 0 unscanned.
          EVENT_ACTION: ${{ github.event_name == 'pull_request' && github.event.action == 'reopened' && 'synchronize' || '' }}
        run: |
          if [ -z "$SOCKET_SECURITY_API_KEY" ]; then
            echo 'SOCKET_SECURITY_API_KEY is not set; skipping the Socket scan'
            exit 0
          fi
          PR_NUMBER=0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi
          socketcli \
            --target-path "$GITHUB_WORKSPACE" \
            --scm github \
            --pr-number "$PR_NUMBER" \
            --exit-code-on-api-error 0
