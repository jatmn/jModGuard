# Rebuild the Discord bot image for code or migration changes on main.
# The bot applies SQL, so migrations share this trigger to avoid duplicate builds.
# No workflow_dispatch:
# a feature branch must not retag :latest. Manual publishes use images.yml.

name: Publish bot image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.bot
      - migrations/**
      - src/bin/jmodguard-bot.rs
      - src/handlers.rs
      - src/automod.rs
      - src/commands/**
      - src/discord.rs
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - vendor/**
      - src/lib.rs
      - src/config.rs
      - src/db.rs
      - src/db/**
      - src/db_compat.rs
      - src/defaults.rs
      - crates/runtime/**
      - src/ids.rs
      - src/logging.rs
      - src/normalize.rs
      - src/remote_https.rs
      - src/state.rs
      - src/templates.rs
      - src/types.rs
      - .github/workflows/publish-bot.yml
      - .github/workflows/publish-image.yml

permissions:
  contents: read
  packages: write

jobs:
  pick-runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  publish:
    needs: pick-runner
    uses: ./.github/workflows/publish-image.yml
    with:
      component: bot
      checkout_ref: ${{ github.sha }}
      runner: ${{ needs.pick-runner.outputs.runner }}
    secrets: inherit
