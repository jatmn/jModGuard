# Reusable GHCR publish for one image (bot or API). Callers decide
# which component and which commit. Magic Containers need a single
# linux/amd64 manifest (no Buildx OCI index).

name: publish-image

on:
  workflow_call:
    inputs:
      component:
        description: bot or api
        required: true
        type: string
      checkout_ref:
        description: Full 40-character commit SHA to compile
        required: true
        type: string
      runner:
        description: JSON runs-on value from pick-runner
        required: true
        type: string
      extra_tag:
        description: Optional extra Docker tag (release tag name)
        required: false
        type: string
        default: ""

concurrency:
  group: ghcr-${{ inputs.component }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - name: Map component
        id: map
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          set -eu
          case "$COMPONENT" in
            bot)
              echo "file=Dockerfile.bot" >> "$GITHUB_OUTPUT"
              echo "image=ghcr.io/jatmn/jmodguard-bot" >> "$GITHUB_OUTPUT"
              echo "package=jmodguard-bot" >> "$GITHUB_OUTPUT"
              ;;
            api)
              echo "file=Dockerfile.api" >> "$GITHUB_OUTPUT"
              echo "image=ghcr.io/jatmn/jmodguard-api" >> "$GITHUB_OUTPUT"
              echo "package=jmodguard-api" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::component must be bot or api, got ${COMPONENT}"
              exit 1
              ;;
          esac

      - name: Refuse empty or non-SHA checkout
        env:
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
        run: |
          set -eu
          if ! printf '%s' "${CHECKOUT_REF}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::checkout_ref must be a full commit SHA."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ steps.map.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ inputs.checkout_ref }}
            type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ steps.map.outputs.file }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE: ${{ steps.map.outputs.package }}
        run: |
          if [ "${OWNER_TYPE}" = "Organization" ]; then
            api_path="/orgs/${PACKAGE_OWNER}/packages/container/${PACKAGE}"
          else
            api_path="/users/${PACKAGE_OWNER}/packages/container/${PACKAGE}"
          fi
          for i in 1 2 3 4 5 6; do
            if gh api --method PATCH "${api_path}" \
              -H "Accept: application/vnd.github+json" \
              -f visibility=public; then
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Could not set ${PACKAGE} public via ${api_path}. Set visibility on the GitHub package page."
          exit 0

      - name: Keep only the current image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE: ${{ steps.map.outputs.package }}
        run: |
          set -eu
          if [ "${OWNER_TYPE}" = "Organization" ]; then
            list_path="/orgs/${PACKAGE_OWNER}/packages/container/${PACKAGE}/versions"
          else
            list_path="/users/${PACKAGE_OWNER}/packages/container/${PACKAGE}/versions"
          fi

          versions="$(gh api --paginate "${list_path}" -H "Accept: application/vnd.github+json")"
          keep_id="$(printf '%s' "${versions}" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          if not isinstance(data, list):
              data = [data]
          keep = None
          for v in data:
              tags = (v.get("metadata") or {}).get("container", {}).get("tags") or []
              if "latest" in tags:
                  keep = v["id"]
                  break
          if keep is None and data:
              keep = data[0]["id"]
          print(keep or "")
          ')"

          if [ -z "${keep_id}" ]; then
            echo "::warning::No GHCR versions found for ${PACKAGE}; skip prune."
            exit 0
          fi

          printf '%s' "${versions}" | KEEP_ID="${keep_id}" LIST_PATH="${list_path}" python3 -c '
          import json, os, subprocess, sys
          data = json.load(sys.stdin)
          if not isinstance(data, list):
              data = [data]
          keep = int(os.environ["KEEP_ID"])
          list_path = os.environ["LIST_PATH"]
          deleted = 0
          for v in data:
              vid = v["id"]
              if vid == keep:
                  tags = (v.get("metadata") or {}).get("container", {}).get("tags") or []
                  print(f"keeping {vid} tags={tags}")
                  continue
              tags = (v.get("metadata") or {}).get("container", {}).get("tags") or []
              path = f"{list_path}/{vid}"
              r = subprocess.run(
                  ["gh", "api", "--method", "DELETE", path, "-H", "Accept: application/vnd.github+json"],
                  capture_output=True,
                  text=True,
              )
              if r.returncode == 0:
                  deleted += 1
                  print(f"deleted {vid} tags={tags}")
              else:
                  print(f"::warning::Could not delete {vid} tags={tags}: {r.stderr.strip() or r.stdout.strip()}")
          print(f"deleted {deleted} older version(s); kept {keep}")
          '
