name: images

# Publish GHCR images only when you cut a GitHub Release (or click
# "Run workflow" and set source_ref to the tag or SHA to compile). PRs and everyday main pushes do not build or push
# images: each matrix image is a full Rust docker compile (~10 min) and
# path-filtered PR builds were still the minutes leak after release-only
# publish. Each publish retags :latest and deletes older package versions
# so GHCR only keeps the current release image (version tag + latest).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing Git tag or full 40-character commit SHA (not a branch)
        required: true
        type: string

concurrency:
  # Every publish retags :latest and prunes older GHCR versions. One group
  # for all releases and manual source_refs so a second dispatch queues
  # instead of cancelling an unrelated SHA, and two source_refs cannot race.
  group: images-publish
  cancel-in-progress: false

# Magic Containers can pull public GHCR images without extra registry auth.
permissions:
  contents: read
  packages: write

jobs:
  pick-runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  # Reject moving refs before checkout. GitHub's commits API resolves
  # branches and short SHAs; tags can move between jobs. Validate that
  # source_ref is an existing tag or identity-checked full SHA, peel tags
  # (including annotated tags) to a commit, and check out only that SHA.
  validate-source-ref:
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.validate.outputs.checkout_ref }}
      docker_tag: ${{ steps.validate.outputs.docker_tag }}
    steps:
      - name: Require tag or full commit SHA
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ inputs.source_ref }}
          EVENT_REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from urllib.parse import quote

          SHA_RE = re.compile(r"^[0-9a-f]{40}$")
          DOCKER_TAG_RE = re.compile(r"^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$")

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          def gh_api(path):
              result = subprocess.run(
                  ["gh", "api", "-H", "Accept: application/vnd.github+json", path],
                  capture_output=True,
                  text=True,
              )
              return result.returncode, result.stdout

          def write_outputs(checkout_ref, docker_tag):
              if not SHA_RE.fullmatch(checkout_ref):
                  fail("internal error: checkout ref is not a full commit SHA.")
              output_path = os.environ["GITHUB_OUTPUT"]
              with open(output_path, "a", encoding="utf-8") as handle:
                  handle.write(f"checkout_ref={checkout_ref}\n")
                  handle.write(f"docker_tag={docker_tag}\n")
              print(f"checkout_ref={checkout_ref}")
              print(f"docker_tag={docker_tag}")

          def docker_tag_from_label(label):
              safe = label.replace("/", "-")
              if not DOCKER_TAG_RE.fullmatch(safe):
                  fail(
                      "source_ref is not a Docker tag after replacing '/' with '-'."
                  )
              return safe

          def peel_tag_to_commit(repo, tag_name):
              code, stdout = gh_api(
                  f"repos/{repo}/git/ref/tags/{quote(tag_name, safe='/')}"
              )
              if code != 0:
                  fail(
                      "source_ref must be an existing Git tag or a full 40-character "
                      "commit SHA. Branch names such as main are rejected because they move."
                  )
              payload = json.loads(stdout)
              resolved = payload.get("ref") or ""
              expected = f"refs/tags/{tag_name}"
              if resolved != expected:
                  fail("source_ref did not resolve to that exact Git tag.")
              obj = payload.get("object") or {}
              obj_type = obj.get("type") or ""
              obj_sha = (obj.get("sha") or "").lower()
              if obj_type == "commit":
                  if not SHA_RE.fullmatch(obj_sha):
                      fail("tag did not resolve to a commit SHA.")
                  return obj_sha
              if obj_type == "tag":
                  # Annotated tag: object.sha is the tag object, not the commit.
                  code, stdout = gh_api(f"repos/{repo}/git/tags/{obj_sha}")
                  if code != 0:
                      fail("could not peel annotated tag to a commit.")
                  peeled = json.loads(stdout).get("object") or {}
                  if peeled.get("type") != "commit":
                      fail("annotated tag does not point at a commit.")
                  commit = (peeled.get("sha") or "").lower()
                  if not SHA_RE.fullmatch(commit):
                      fail("annotated tag did not resolve to a commit SHA.")
                  return commit
              fail(f"tag object type {obj_type!r} is not a commit.")

          event_name = os.environ["EVENT_NAME"]
          repo = os.environ["REPO"]

          if event_name != "workflow_dispatch":
              event_ref = os.environ["EVENT_REF"]
              if not event_ref.startswith("refs/tags/"):
                  fail("release checkout must be a tag, not a branch.")
              tag_name = event_ref[len("refs/tags/") :]
              write_outputs(peel_tag_to_commit(repo, tag_name), "unused")
              sys.exit(0)

          ref = (os.environ.get("SOURCE_REF") or "").strip()
          if not ref:
              fail("source_ref is required.")
          if ref.startswith("refs/heads/"):
              fail(
                  "source_ref must be a Git tag or a full 40-character commit SHA, "
                  "not a branch."
              )
          if ref.startswith("refs/tags/"):
              ref = ref[len("refs/tags/") :]

          if re.fullmatch(r"[0-9a-fA-F]{40}", ref):
              code, stdout = gh_api(f"repos/{repo}/commits/{ref}")
              if code != 0:
                  fail("source_ref is not an existing full commit SHA.")
              got = (json.loads(stdout).get("sha") or "").lower()
              # commits/<short> and commits/main both resolve; require identity.
              if got != ref.lower():
                  fail(
                      "source_ref must be the full 40-character commit SHA. "
                      "Branch names and abbreviated SHAs are rejected because they move."
                  )
              write_outputs(got, docker_tag_from_label(got))
              sys.exit(0)

          sha = peel_tag_to_commit(repo, ref)
          write_outputs(sha, docker_tag_from_label(ref))
          PY

  build:
    needs:
      - pick-runner
      - validate-source-ref
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bot
            file: Dockerfile.bot
            image: ghcr.io/jatmn/jmodguard-bot
            package: jmodguard-bot
          - name: api
            file: Dockerfile.api
            image: ghcr.io/jatmn/jmodguard-api
            package: jmodguard-api
    steps:
      - name: Refuse empty or non-SHA checkout
        env:
          CHECKOUT_REF: ${{ needs.validate-source-ref.outputs.checkout_ref }}
        run: |
          set -eu
          if ! printf '%s' "${CHECKOUT_REF}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::validated checkout ref must be a full commit SHA; refusing to default to the dispatch branch or follow a moving tag."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # Peeled commit SHA from validate-source-ref. Never github.ref on
          # workflow_dispatch (that is the branch that contains this file),
          # and never a tag name (tags can move between validate and checkout).
          ref: ${{ needs.validate-source-ref.outputs.checkout_ref }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=raw,value=${{ needs.validate-source-ref.outputs.checkout_ref }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ needs.validate-source-ref.outputs.docker_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          # Magic Containers cannot pull Buildx OCI indexes (attestation
          # sibling). A single linux/amd64 image manifest is the digest we pin.
          provenance: false
          sbom: false
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Builder cargo must clone the private libsql-sqlite3-parser git pin.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      # GitHub creates GHCR packages as private. PATCH /user/packages is the
      # Actions token identity, not the package owner — use /users or /orgs.
      - name: Make package public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE: ${{ matrix.package }}
        run: |
          if [ "${OWNER_TYPE}" = "Organization" ]; then
            api_path="/orgs/${PACKAGE_OWNER}/packages/container/${PACKAGE}"
          else
            api_path="/users/${PACKAGE_OWNER}/packages/container/${PACKAGE}"
          fi
          for i in 1 2 3 4 5 6; do
            if gh api --method PATCH "${api_path}" \
              -H "Accept: application/vnd.github+json" \
              -f visibility=public; then
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Could not set ${PACKAGE} public via ${api_path}. Set visibility on the GitHub package page."
          exit 0

      - name: Keep only the current image
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -eu
          if [ "${OWNER_TYPE}" = "Organization" ]; then
            list_path="/orgs/${PACKAGE_OWNER}/packages/container/${PACKAGE}/versions"
          else
            list_path="/users/${PACKAGE_OWNER}/packages/container/${PACKAGE}/versions"
          fi

          versions="$(gh api --paginate "${list_path}" -H "Accept: application/vnd.github+json")"
          keep_id="$(printf '%s' "${versions}" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          if not isinstance(data, list):
              data = [data]
          keep = None
          for v in data:
              tags = (v.get("metadata") or {}).get("container", {}).get("tags") or []
              if "latest" in tags:
                  keep = v["id"]
                  break
          if keep is None and data:
              keep = data[0]["id"]
          print(keep or "")
          ')"

          if [ -z "${keep_id}" ]; then
            echo "::warning::No GHCR versions found for ${PACKAGE}; skip prune."
            exit 0
          fi

          printf '%s' "${versions}" | KEEP_ID="${keep_id}" LIST_PATH="${list_path}" python3 -c '
          import json, os, subprocess, sys
          data = json.load(sys.stdin)
          if not isinstance(data, list):
              data = [data]
          keep = int(os.environ["KEEP_ID"])
          list_path = os.environ["LIST_PATH"]
          deleted = 0
          for v in data:
              vid = v["id"]
              if vid == keep:
                  tags = (v.get("metadata") or {}).get("container", {}).get("tags") or []
                  print(f"keeping {vid} tags={tags}")
                  continue
              tags = (v.get("metadata") or {}).get("container", {}).get("tags") or []
              path = f"{list_path}/{vid}"
              r = subprocess.run(
                  ["gh", "api", "--method", "DELETE", path, "-H", "Accept: application/vnd.github+json"],
                  capture_output=True,
                  text=True,
              )
              if r.returncode == 0:
                  deleted += 1
                  print(f"deleted {vid} tags={tags}")
              else:
                  print(f"::warning::Could not delete {vid} tags={tags}: {r.stderr.strip() or r.stdout.strip()}")
          print(f"deleted {deleted} older version(s); kept {keep}")
          '
