name: images

# Publish both GHCR images from a GitHub Release or a manual source_ref
# (tag or full SHA, not a branch). Everyday pushes do not run this
# workflow. Path-filtered Publish bot/API/database image workflows on main
# build one image at a time. Each publish retags :latest for that package
# and deletes older versions of that package only.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing Git tag or full 40-character commit SHA (not a branch)
        required: true
        type: string

concurrency:
  # Every publish retags :latest and prunes older GHCR versions. One group
  # for all releases and manual source_refs so a second dispatch queues
  # instead of cancelling an unrelated SHA, and two source_refs cannot race.
  group: images-publish
  cancel-in-progress: false

# Magic Containers can pull public GHCR images without extra registry auth.
permissions:
  contents: read
  packages: write

jobs:
  pick-runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  # Reject moving refs before checkout. GitHub's commits API resolves
  # branches and short SHAs; tags can move between jobs. Validate that
  # source_ref is an existing tag or identity-checked full SHA, peel tags
  # (including annotated tags) to a commit, and check out only that SHA.
  validate-source-ref:
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.validate.outputs.checkout_ref }}
      docker_tag: ${{ steps.validate.outputs.docker_tag }}
    steps:
      - name: Require tag or full commit SHA
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ inputs.source_ref }}
          EVENT_REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from urllib.parse import quote

          SHA_RE = re.compile(r"^[0-9a-f]{40}$")
          DOCKER_TAG_RE = re.compile(r"^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$")

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          def gh_api(path):
              result = subprocess.run(
                  ["gh", "api", "-H", "Accept: application/vnd.github+json", path],
                  capture_output=True,
                  text=True,
              )
              return result.returncode, result.stdout

          def write_outputs(checkout_ref, docker_tag):
              if not SHA_RE.fullmatch(checkout_ref):
                  fail("internal error: checkout ref is not a full commit SHA.")
              output_path = os.environ["GITHUB_OUTPUT"]
              with open(output_path, "a", encoding="utf-8") as handle:
                  handle.write(f"checkout_ref={checkout_ref}\n")
                  handle.write(f"docker_tag={docker_tag}\n")
              print(f"checkout_ref={checkout_ref}")
              print(f"docker_tag={docker_tag}")

          def docker_tag_from_label(label):
              safe = label.replace("/", "-")
              if not DOCKER_TAG_RE.fullmatch(safe):
                  fail(
                      "source_ref is not a Docker tag after replacing '/' with '-'."
                  )
              return safe

          def extra_docker_tag_from_git_tag(label):
              # Release Git tags may include characters Docker rejects (e.g. +).
              # Skip the extra image tag rather than failing the publish; latest
              # and the commit SHA are still applied in publish-image.yml.
              safe = label.replace("/", "-").replace("+", "-")
              if DOCKER_TAG_RE.fullmatch(safe):
                  return safe
              print(
                  f"::warning::Git tag {label!r} is not a Docker tag; "
                  "publishing latest and the commit SHA only."
              )
              return ""

          def peel_tag_to_commit(repo, tag_name):
              code, stdout = gh_api(
                  f"repos/{repo}/git/ref/tags/{quote(tag_name, safe='/')}"
              )
              if code != 0:
                  fail(
                      "source_ref must be an existing Git tag or a full 40-character "
                      "commit SHA. Branch names such as main are rejected because they move."
                  )
              payload = json.loads(stdout)
              resolved = payload.get("ref") or ""
              expected = f"refs/tags/{tag_name}"
              if resolved != expected:
                  fail("source_ref did not resolve to that exact Git tag.")
              obj = payload.get("object") or {}
              obj_type = obj.get("type") or ""
              obj_sha = (obj.get("sha") or "").lower()
              if obj_type == "commit":
                  if not SHA_RE.fullmatch(obj_sha):
                      fail("tag did not resolve to a commit SHA.")
                  return obj_sha
              if obj_type == "tag":
                  # Annotated tag: object.sha is the tag object, not the commit.
                  code, stdout = gh_api(f"repos/{repo}/git/tags/{obj_sha}")
                  if code != 0:
                      fail("could not peel annotated tag to a commit.")
                  peeled = json.loads(stdout).get("object") or {}
                  if peeled.get("type") != "commit":
                      fail("annotated tag does not point at a commit.")
                  commit = (peeled.get("sha") or "").lower()
                  if not SHA_RE.fullmatch(commit):
                      fail("annotated tag did not resolve to a commit SHA.")
                  return commit
              fail(f"tag object type {obj_type!r} is not a commit.")

          event_name = os.environ["EVENT_NAME"]
          repo = os.environ["REPO"]

          if event_name != "workflow_dispatch":
              event_ref = os.environ["EVENT_REF"]
              if not event_ref.startswith("refs/tags/"):
                  fail("release checkout must be a tag, not a branch.")
              tag_name = event_ref[len("refs/tags/") :]
              write_outputs(peel_tag_to_commit(repo, tag_name), extra_docker_tag_from_git_tag(tag_name))
              sys.exit(0)

          ref = (os.environ.get("SOURCE_REF") or "").strip()
          if not ref:
              fail("source_ref is required.")
          if ref.startswith("refs/heads/"):
              fail(
                  "source_ref must be a Git tag or a full 40-character commit SHA, "
                  "not a branch."
              )
          if ref.startswith("refs/tags/"):
              ref = ref[len("refs/tags/") :]

          if re.fullmatch(r"[0-9a-fA-F]{40}", ref):
              code, stdout = gh_api(f"repos/{repo}/commits/{ref}")
              if code != 0:
                  fail("source_ref is not an existing full commit SHA.")
              got = (json.loads(stdout).get("sha") or "").lower()
              # commits/<short> and commits/main both resolve; require identity.
              if got != ref.lower():
                  fail(
                      "source_ref must be the full 40-character commit SHA. "
                      "Branch names and abbreviated SHAs are rejected because they move."
                  )
              write_outputs(got, docker_tag_from_label(got))
              sys.exit(0)

          sha = peel_tag_to_commit(repo, ref)
          write_outputs(sha, docker_tag_from_label(ref))
          PY

  publish-bot:
    needs:
      - pick-runner
      - validate-source-ref
    uses: ./.github/workflows/publish-image.yml
    with:
      component: bot
      checkout_ref: ${{ needs.validate-source-ref.outputs.checkout_ref }}
      runner: ${{ needs.pick-runner.outputs.runner }}
      extra_tag: ${{ needs.validate-source-ref.outputs.docker_tag }}
    secrets: inherit

  publish-api:
    needs:
      - pick-runner
      - validate-source-ref
    uses: ./.github/workflows/publish-image.yml
    with:
      component: api
      checkout_ref: ${{ needs.validate-source-ref.outputs.checkout_ref }}
      runner: ${{ needs.pick-runner.outputs.runner }}
      extra_tag: ${{ needs.validate-source-ref.outputs.docker_tag }}
    secrets: inherit
