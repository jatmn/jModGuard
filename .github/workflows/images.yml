name: images

# Publish GHCR images only when you cut a GitHub Release (or click
# "Run workflow" and set source_ref to the tag or SHA to compile). PRs and everyday main pushes do not build or push
# images: each matrix image is a full Rust docker compile (~10 min) and
# path-filtered PR builds were still the minutes leak after release-only
# publish. Each publish retags :latest and deletes older package versions
# so GHCR only keeps the current release image (version tag + latest).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git tag or full commit SHA to build (must exist in this repo)
        required: true
        type: string

concurrency:
  # Every publish retags :latest and prunes older GHCR versions. One group
  # for all releases and manual source_refs so a second dispatch queues
  # instead of cancelling an unrelated SHA, and two source_refs cannot race.
  group: images-publish
  cancel-in-progress: false

# Magic Containers can pull public GHCR images without extra registry auth.
permissions:
  contents: read
  packages: write

jobs:
  pick-runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  build:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bot
            file: Dockerfile.bot
            image: ghcr.io/jatmn/jmodguard-bot
            package: jmodguard-bot
          - name: api
            file: Dockerfile.api
            image: ghcr.io/jatmn/jmodguard-api
            package: jmodguard-api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # Release events build the tag. Manual runs build inputs.source_ref
          # (a tag or SHA). github.ref on workflow_dispatch is only the branch
          # that contains this workflow file, not the revision to compile.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker-safe extra tag
        id: extra_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -eu
          if [ "${EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "enable=false" >> "$GITHUB_OUTPUT"
            echo "value=unused" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          raw="${SOURCE_REF}"
          raw="${raw#refs/tags/}"
          raw="${raw#refs/heads/}"
          # Git tags may contain /; Docker tags may not.
          safe="${raw//\//-}"
          if ! printf '%s' "${safe}" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "::error::source_ref is not a Docker tag after replacing '/' with '-'."
            exit 1
          fi
          echo "enable=true" >> "$GITHUB_OUTPUT"
          echo "value=${safe}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=raw,value=${{ steps.extra_tag.outputs.value }},enable=${{ steps.extra_tag.outputs.enable }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Builder cargo must clone the private libsql-sqlite3-parser git pin.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      # GitHub creates GHCR packages as private. PATCH /user/packages is the
      # Actions token identity, not the package owner — use /users or /orgs.
      - name: Make package public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE: ${{ matrix.package }}
        run: |
          if [ "${OWNER_TYPE}" = "Organization" ]; then
            api_path="/orgs/${PACKAGE_OWNER}/packages/container/${PACKAGE}"
          else
            api_path="/users/${PACKAGE_OWNER}/packages/container/${PACKAGE}"
          fi
          for i in 1 2 3 4 5 6; do
            if gh api --method PATCH "${api_path}" \
              -H "Accept: application/vnd.github+json" \
              -f visibility=public; then
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Could not set ${PACKAGE} public via ${api_path}. Set visibility on the GitHub package page."
          exit 0

      - name: Keep only the current image
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -eu
          if [ "${OWNER_TYPE}" = "Organization" ]; then
            list_path="/orgs/${PACKAGE_OWNER}/packages/container/${PACKAGE}/versions"
          else
            list_path="/users/${PACKAGE_OWNER}/packages/container/${PACKAGE}/versions"
          fi

          versions="$(gh api --paginate "${list_path}" -H "Accept: application/vnd.github+json")"
          keep_id="$(printf '%s' "${versions}" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          if not isinstance(data, list):
              data = [data]
          keep = None
          for v in data:
              tags = (v.get("metadata") or {}).get("container", {}).get("tags") or []
              if "latest" in tags:
                  keep = v["id"]
                  break
          if keep is None and data:
              keep = data[0]["id"]
          print(keep or "")
          ')"

          if [ -z "${keep_id}" ]; then
            echo "::warning::No GHCR versions found for ${PACKAGE}; skip prune."
            exit 0
          fi

          printf '%s' "${versions}" | KEEP_ID="${keep_id}" LIST_PATH="${list_path}" python3 -c '
          import json, os, subprocess, sys
          data = json.load(sys.stdin)
          if not isinstance(data, list):
              data = [data]
          keep = int(os.environ["KEEP_ID"])
          list_path = os.environ["LIST_PATH"]
          deleted = 0
          for v in data:
              vid = v["id"]
              if vid == keep:
                  tags = (v.get("metadata") or {}).get("container", {}).get("tags") or []
                  print(f"keeping {vid} tags={tags}")
                  continue
              tags = (v.get("metadata") or {}).get("container", {}).get("tags") or []
              path = f"{list_path}/{vid}"
              r = subprocess.run(
                  ["gh", "api", "--method", "DELETE", path, "-H", "Accept: application/vnd.github+json"],
                  capture_output=True,
                  text=True,
              )
              if r.returncode == 0:
                  deleted += 1
                  print(f"deleted {vid} tags={tags}")
              else:
                  print(f"::warning::Could not delete {vid} tags={tags}: {r.stderr.strip() or r.stdout.strip()}")
          print(f"deleted {deleted} older version(s); kept {keep}")
          '
