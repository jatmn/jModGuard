name: Pullfrog owner command

# Pullfrog is deliberately separate from Buildkite CI. A new comment from the
# repository owner is the only event that can reach the agent step.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  pullfrog:
    if: >-
      github.run_attempt == 1 &&
      github.actor == 'jatmn' &&
      github.event.comment.user.id == 12479882 &&
      contains(github.event.comment.body, '@pullfrog')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Verify owner command
        id: authorize
        run: node scripts/pullfrog-command-check.mjs

      - name: Run Pullfrog
        if: steps.authorize.outputs.authorized == 'true'
        # Keep this pin and PULLFROG_VERSION in the command helper in sync.
        uses: pullfrog/pullfrog@ce127b38d7f0c6c5e2c40ccd290adc4c5652357f # v0.1.82
        with:
          prompt: ${{ steps.authorize.outputs.payload }}
          # v0.1.82 supports this override for both native PR checks. The
          # structured event above supplies their PR identity without dispatch.
          status_checks: enabled
          push: restricted
          shell: restricted
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
