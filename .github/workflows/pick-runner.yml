name: pick-runner

on:
  workflow_call:
    outputs:
      runner:
        description: JSON-encoded runs-on value for fromJSON
        value: ${{ jobs.pick-runner.outputs.runner }}
    secrets:
      RUNNER_READ_TOKEN:
        description: Token that can list repository self-hosted runners
        required: false

jobs:
  pick-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Pick self-hosted runner if online
        id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_READ_TOKEN || github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -eu
          fallback='"ubuntu-latest"'
          preferred='["self-hosted","linux","proxmox"]'
          echo "runner=${fallback}" >> "${GITHUB_OUTPUT}"

          event="${EVENT_NAME:-}"
          ref="${EVENT_REF:-}"
          repo="${REPO:-}"
          owner="${OWNER:-}"
          actor="${ACTOR:-}"
          pr_head_repo="${PR_HEAD_REPO:-}"
          trusted=0
          case_matched=""

          if [ "${event}" = "push" ] && [ "${ref}" = "refs/heads/main" ]; then
            trusted=1
            case_matched="push to refs/heads/main"
          elif [ "${event}" = "release" ]; then
            trusted=1
            case_matched="release"
          elif [ "${event}" = "workflow_dispatch" ]; then
            trusted=1
            case_matched="workflow_dispatch"
          elif [ "${event}" = "pull_request" ] && [ -n "${actor}" ] && [ -n "${owner}" ] && [ "${actor}" = "${owner}" ] && [ -n "${pr_head_repo}" ] && [ -n "${repo}" ] && [ "${pr_head_repo}" = "${repo}" ]; then
            trusted=1
            case_matched="owner same-repo pull_request (actor=${actor} owner=${owner} head=${pr_head_repo} repo=${repo})"
          elif [ "${event}" = "pull_request" ]; then
            case_matched="untrusted pull_request (actor=${actor} owner=${owner} head=${pr_head_repo} repo=${repo})"
          elif [ "${event}" = "pull_request_target" ]; then
            case_matched="untrusted pull_request_target"
          else
            case_matched="untrusted event (${event:-empty})"
          fi

          if [ "${trusted}" -eq 0 ]; then
            echo "Untrusted: ${case_matched}; using GitHub-hosted runner"
            exit 0
          fi
          echo "Trusted: ${case_matched}; preferring Proxmox if online"

          tmp="$(mktemp)"
          err="$(mktemp)"
          if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runners" --jq '.runners[]' >"${tmp}" 2>"${err}"; then
            echo "::warning::Runners API failed; falling back to ubuntu-latest"
            exit 0
          fi

          selected="$(python3 - "${tmp}" <<'PY' || true
          import json
          import sys

          wanted = {"self-hosted", "linux", "proxmox"}

          def fail_open():
              print('"ubuntu-latest"')
              raise SystemExit(0)

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  raw = handle.read()
          except Exception:
              fail_open()

          def collect_runners(text):
              runners = []
              decoder = json.JSONDecoder()
              idx = 0
              length = len(text)
              while idx < length:
                  while idx < length and text[idx].isspace():
                      idx += 1
                  if idx >= length:
                      break
                  obj, end = decoder.raw_decode(text, idx)
                  idx = end
                  if isinstance(obj, dict):
                      page = obj.get("runners")
                      if isinstance(page, list):
                          runners.extend(page)
                      else:
                          runners.append(obj)
                  elif isinstance(obj, list):
                      runners.extend(obj)
                  else:
                      raise ValueError("unexpected JSON value")
              return runners

          try:
              runners = collect_runners(raw)
          except Exception:
              fail_open()

          for runner in runners:
              if not isinstance(runner, dict):
                  continue
              if str(runner.get("status") or "").lower() != "online":
                  continue
              labels = {
                  str(label.get("name") or "").lower()
                  for label in (runner.get("labels") or [])
              }
              if wanted <= labels:
                  print('["self-hosted","linux","proxmox"]')
                  raise SystemExit(0)

          print('"ubuntu-latest"')
          PY
          )"
          selected="$(printf '%s' "${selected}" | tr -d '\n')"
          if [ -z "${selected}" ]; then
            selected="${fallback}"
          fi
          echo "runner=${selected}" >> "${GITHUB_OUTPUT}"
          echo "Selected runs-on: ${selected}"
